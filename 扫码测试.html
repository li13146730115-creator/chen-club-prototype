<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>会所点单二维码测试</title><style>body{font-family:system-ui;background:#f5f1e7;color:#244437;text-align:center;padding:40px}.codes{display:flex;justify-content:center;gap:30px}.item{padding:30px;background:white;border-radius:14px}.qr{padding:20px}p{font-size:13px}a{color:#947440}</style><h1>会所点单二维码</h1><p>原型桌码，用手机打开线上原型的“扫码点单”扫描。仅为联调示例，不连接生产商城。</p><div class="codes"><section class="item"><h2>北京宸园</h2><div class="qr" id="bj"></div><p>茶室／棋牌服务点 · T01 桌</p></section><section class="item"><h2>紫京宸园</h2><div class="qr" id="zx"></div><p>行政酒廊服务点 · A02 桌</p></section><section class="item"><h2>中建项目会所</h2><div class="qr" id="zj"></div><p>茶室／棋牌服务点 · T03 桌</p></section></div><p>北京有客户已列商品；其余项目没有完整点单明细，保留待补状态。</p><a href="index.html?v=4.5#/U01">返回原型</a><script src="assets/qrcode.min.js"></script><script>for(const [id,scene,table] of [['bj','tea','T01'],['zx','lounge','A02'],['zj','tea','T03']])new QRCode(document.getElementById(id),{text:'CHENCLUB:ORDER:'+id+':'+scene+':'+table,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});</script></html>
